<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const POSEOFF = Q.has('poseoff') ? (Q.get('poseoff').split(',').map(Number).concat([0, 0, 0, 0])).slice(0, 4) : null;   // debug: dyaw,dpitch,dx,dz for pose fitting

const DEG = Math.PI / 180;
const LOOP = 10.5;

// ---------------------------------------------------------------- room dims (m)
// x: west(0) -> east(W). z: north wall (0) -> south wall (D). y up.
const W = 3.3, D = 3.6, H = 2.86;
const DOOR_X0 = 0.24, DOOR_X1 = 1.08, DOOR_H = 2.12;
const WIN_X0 = 0.32, WIN_X1 = 3.12, WIN_Y0 = 0.96, WIN_Y1 = 2.14;
const SH_X0 = 1.15, SH_X1 = 3.06, SH_D = 0.40;           // shelf unit
const DESK_Z0 = 0.95, DESK_Z1 = 2.92, DESK_X0 = 2.2, DESK_H = 0.75;   // deep corner desk (1.1 m), fitted to ref S3

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
let PR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.shadowMap.enabled = true;

renderer.shadowMap.needsUpdate = true;
document.body.appendChild(renderer.domElement);
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdde3ea);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 40);

// ---------------------------------------------------------------- utils
let seed = 1337;

  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); return t;
}
const col = h => new THREE.Color(h);

// ---------------------------------------------------------------- batches (merged geometry, 1 draw call each)
let ZOFF = 0, YOFF = 0;   // temporary shift used while placing a group of wall items
class Batch {

  add(geo, m, color = 0xffffff) {

    g.applyMatrix4(m); if (ZOFF || YOFF) g.translate(0, YOFF, ZOFF);
    const n = g.attributes.position.count, c = new THREE.Color(color), ca = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { ca[i * 3] = c.r; ca[i * 3 + 1] = c.g; ca[i * 3 + 2] = c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(ca, 3));
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
    if (this.worldUV) {

      for (let i = 0; i < n; i++) {
        const ax = Math.abs(nm.getX(i)), ay = Math.abs(nm.getY(i)), az = Math.abs(nm.getZ(i));
        if (ay >= ax && ay >= az) uv.setXY(i, p.getX(i) * s, p.getZ(i) * s);
        else if (ax >= az) uv.setXY(i, p.getZ(i) * s, p.getY(i) * s * 2);
        else uv.setXY(i, p.getX(i) * s, p.getY(i) * s * 2);
      }

    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv', 'color'].includes(k)) g.deleteAttribute(k);

  }
  build(parent = scene) {

    const m = new THREE.Mesh(mergeGeometries(this.g), this.mat);
    m.castShadow = this.cast; m.receiveShadow = this.receive; parent.add(m); this.g = []; return m;
  }

const M4 = new THREE.Matrix4(), Q4 = new THREE.Quaternion(), E4 = new THREE.Euler(), V4 = new THREE.Vector3(), S4 = new THREE.Vector3();
function mat(x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  return new THREE.Matrix4().compose(V4.set(x, y, z), Q4.setFromEuler(E4.set(rx, ry, rz, 'YXZ')), S4.set(sx, sy, sz));
}
const UNIT = new THREE.BoxGeometry(1, 1, 1);
// box by min/max extents
function bx(b, x0, x1, y0, y1, z0, z1, c) { b.add(UNIT, mat((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2, 0, 0, 0, x1 - x0, y1 - y0, z1 - z0), c); }
// box by center/size/rotation
function bc(b, x, y, z, w, h, d, c, ry = 0, rx = 0, rz = 0) { b.add(UNIT, mat(x, y, z, rx, ry, rz, w, h, d), c); }
const rbCache = new Map();
function rbox(b, x, y, z, w, h, d, r, c, ry = 0, rx = 0, rz = 0) {
  const key = [w, h, d, r].map(v => v.toFixed(3)).join();
  let g = rbCache.get(key); if (!g) { g = new RoundedBoxGeometry(w, h, d, 2, r); rbCache.set(key, g); }
  b.add(g, mat(x, y, z, rx, ry, rz), c);
}
function cyl(b, x, y, z, rt, rb, h, c, seg = 16, rx = 0, ry = 0, rz = 0, open = false) {
  b.add(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), mat(x, y, z, rx, ry, rz), c);
}

// ---------------------------------------------------------------- procedural textures
function floorTex() {
  const S = 2048, [c, g] = cnv(S, S), ppm = S / 3.6;     // 3.6m square, planks run along canvas Y (= world z)
  const pw = 0.165 * ppm, pl = 1.22 * ppm;
  g.fillStyle = '#4a4440'; g.fillRect(0, 0, S, S);
  for (let i = 0; i * pw < S; i++) {
    let y = -rnd() * pl;
    while (y < S) {
      const L = pl * rr(0.7, 1.15), x = i * pw;
      const base = rr(0.9, 1.08), tone = rr(-5, 5);
      const r = 94 * base + tone, gg = 80 * base + tone * 0.6, bb = 70 * base;   // Grok v2: warmer, lower-contrast planks like the video
      g.fillStyle = `rgb(${r | 0},${gg | 0},${bb | 0})`; g.fillRect(x, y, pw, L);
      for (let k = 0; k < 22; k++) {             // grain streaks
        const gx = x + rnd() * pw, wv = rr(0.6, 2.4), lt = rnd() < 0.5;
        g.strokeStyle = lt ? `rgba(190,178,165,${rr(0.012, 0.04)})` : `rgba(30,25,22,${rr(0.015, 0.05)})`;
        g.lineWidth = wv * 2.2; g.beginPath(); g.moveTo(gx, y);
        for (let s = 0; s <= 8; s++) g.lineTo(gx + Math.sin(s * 0.9 + k) * rr(0.5, 2.5), y + L * s / 8);
        g.stroke();
      }
      for (let k = 0; k < 3; k++) {             // knots / cathedral
        const kx = x + rr(0.2, 0.8) * pw, ky = y + rnd() * L;
        g.strokeStyle = `rgba(30,24,20,${rr(0.08, 0.18)})`; g.lineWidth = 1.2;
        for (let e = 1; e < 5; e++) { g.beginPath(); g.ellipse(kx, ky, e * 3, e * 22, 0, 0, 7); g.stroke(); }
      }
      g.fillStyle = 'rgba(18,15,13,0.35)'; g.fillRect(x, y, pw, 2);           // end seam
      y += L;
    }
    g.fillStyle = 'rgba(18,15,13,0.6)'; g.fillRect(i * pw, 0, 2, S);       // long seam
  }
  const t = ctex(c, [1, 1]); return t;
}
function oakTex() {
  const [c, g] = cnv(1024, 512);
  g.fillStyle = '#937760'; g.fillRect(0, 0, 1024, 512);
  for (let k = 0; k < 420; k++) {
    const y = rnd() * 512, lt = rnd() < 0.5;
    g.strokeStyle = lt ? `rgba(235,222,200,${rr(0.03, 0.12)})` : `rgba(95,75,58,${rr(0.03, 0.12)})`;
    g.lineWidth = rr(0.6, 2.4); g.beginPath(); g.moveTo(0, y);
    for (let s = 0; s <= 16; s++) g.lineTo(s * 64, y + Math.sin(s * 0.7 + k) * rr(0.5, 3));
    g.stroke();
  }
  for (let k = 0; k < 6; k++) {
    const x = rnd() * 1024, y = rnd() * 512; g.strokeStyle = 'rgba(100,80,60,0.12)';
    for (let e = 1; e < 6; e++) { g.beginPath(); g.ellipse(x, y, e * 26, e * 3, 0, 0, 7); g.stroke(); }
  }
  return ctex(c);
}
function reddishWoodTex() {
  const [c, g] = cnv(256, 1024);
  g.fillStyle = '#a4563f'; g.fillRect(0, 0, 256, 1024);
  for (let k = 0; k < 160; k++) {
    const x = rnd() * 256; g.strokeStyle = rnd() < .5 ? `rgba(200,120,90,${rr(.05, .18)})` : `rgba(70,30,20,${rr(.05, .18)})`;
    g.lineWidth = rr(0.5, 2); g.beginPath(); g.moveTo(x, 0);
    for (let s = 0; s <= 16; s++) g.lineTo(x + Math.sin(s * .5 + k) * 2, s * 64); g.stroke();
  }
  return ctex(c);
}
// wall texture with baked AO towards edges; uv in metres (repeat 1/w,1/h)
function wallTex(w, h, opts = {}) {
  const S = 512, [c, g] = cnv(S, S);
  g.fillStyle = opts.base || '#f5f4f1'; g.fillRect(0, 0, S, S);
  // baked corner occlusion: a tight dark core plus a wide soft falloff (eased stops, no visible band)
  const edge = (x0, y0, x1, y1, a, rgb = '84,82,86') => { const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(0.15, `rgba(${rgb},${a * 0.62})`); gr.addColorStop(0.45, `rgba(${rgb},${a * 0.22})`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, S, S); };
  const ex = 0.7 / w * S, ey = 0.6 / h * S, k = 1.65;
  edge(0, 0, ex, 0, (opts.l ?? 0.22) * k); edge(S, 0, S - ex, 0, (opts.r ?? 0.22) * k);
  edge(0, S, 0, S - ey * 1.4, (opts.top ?? 0.24) * k); edge(0, 0, 0, ey * 0.8, (opts.bottom ?? 0.14) * k);
  edge(0, 0, 0, 0.45 / h * S, 0.07, '196,140,96');     // warm bounce from the wood floor on the lowest ~45 cm
  if (opts.grad) { const gr = g.createLinearGradient(S, 0, 0, 0); gr.addColorStop(0, 'rgba(70,68,72,0)'); gr.addColorStop(0.45, 'rgba(70,68,72,0)'); gr.addColorStop(1, `rgba(70,68,72,${opts.grad})`); g.fillStyle = gr; g.fillRect(0, 0, S, S); }
  for (let i = 0; i < 2200; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '0,0,0' : '255,255,255'},0.025)`; g.fillRect(rnd() * S, rnd() * S, 2, 2); }
  const t = ctex(c, [1 / w, 1 / h]); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t;
}
function noiseTex(size, base, amp, rep, srgb = true) {
  const [c, g] = cnv(size, size); g.fillStyle = base; g.fillRect(0, 0, size, size);
  const id = g.getImageData(0, 0, size, size), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * amp; d[i] += n; d[i + 1] += n; d[i + 2] += n; }

}
function fabricTex() {
  const S = 256, [c, g] = cnv(S, S); const id = g.createImageData(S, S), d = id.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = (y * S + x) * 4, w = ((x + y) % 2 ? 6 : -6) + (rnd() - .5) * 40;

// floor-plan drawing (used for screens and papers)
function drawPlan(g, x, y, w, h, bg = '#efe3cc', ink = '#3c3a36', seedv = 1) {
  const s0 = seed; seed = seedv * 7919;

  const m = w * 0.08; g.strokeRect(x + m, y + m, w - 2 * m, h - 2 * m);
  for (let i = 0; i < 6; i++) {
    const rx = x + m + rnd() * (w - 2 * m) * .7, ry = y + m + rnd() * (h - 2 * m) * .7;
    g.strokeRect(rx, ry, rr(.15, .35) * w, rr(.15, .35) * h);
  }
  for (let i = 0; i < 5; i++) { const ax = x + m + rnd() * (w - 2 * m), ay = y + m + rnd() * (h - 2 * m), r = w * rr(.04, .07);
    g.beginPath(); g.moveTo(ax, ay); g.arc(ax, ay, r, 0, Math.PI / 2); g.closePath(); g.stroke(); }

}
function codeLines(g, x, y, w, h, lh, colors, dens = 1) {
  for (let yy = y; yy < y + h - lh; yy += lh) {

}
function ultrawideTex() {
  // Grok v3: laid out from the video frame (S2): white door-symbol doc left, muted inspector, two plan images, right inspector, small dock
  const W2 = 2048, H2 = 860, [c, g] = cnv(W2, H2), X = f => f * W2, Y = f => f * H2;
  g.fillStyle = '#1d1d21'; g.fillRect(0, 0, W2, H2);
  g.fillStyle = '#2a2a2f'; g.fillRect(0, 0, W2, Y(0.035));
  for (let i = 0; i < 28; i++) { g.fillStyle = pick(['#d44', '#e95', '#c84', '#888', '#999']); g.fillRect(X(0.33) + i * 30, 9, 16, 8); }
  for (let i = 0; i < 12; i++) { g.fillStyle = '#aaa'; g.fillRect(X(0.78) + i * 34, 9, 20, 8); }

  g.fillStyle = '#f2f2f1'; g.fillRect(X(0.012), Y(0.05), X(0.4), Y(0.72));
  g.strokeStyle = '#8b8b8e'; g.lineWidth = 2.5;
  for (let r = 0; r < 2; r++) for (let i = 0; i < 4; i++) {

    g.beginPath(); g.moveTo(ax, ay + R); g.lineTo(ax + R, ay + R); g.stroke();

    g.beginPath(); g.moveTo(ax, ay); g.lineTo(ax, ay + R); g.stroke();
    g.fillStyle = '#b8b8bb'; g.fillRect(ax, ay + R + 8, R * 0.9, 4);
  }
  g.strokeStyle = '#c8c8cb'; g.lineWidth = 2; g.strokeRect(X(0.02), Y(0.12), X(0.385), Y(0.42));
  g.fillStyle = '#4060d8'; g.fillRect(X(0.18), Y(0.6), X(0.05), 7);
  g.strokeStyle = '#b5b5b8'; g.beginPath(); g.moveTo(X(0.17), Y(0.58)); g.lineTo(X(0.24), Y(0.58)); g.stroke();
  for (let k = 0; k < 3; k++) { g.fillStyle = '#d6d6d8'; g.fillRect(X(0.05), Y(0.66) + k * 22, X(0.32), 6); }
  // dark canvas below doc + small blue buttons
  g.fillStyle = '#26262b'; g.fillRect(X(0.012), Y(0.77), X(0.4), Y(0.19));

const bookGeo = [];
function book(x, y, z, th, h, dp, ci, { flat = false, ry = 0, rz = 0 } = {}) {
  const g = new THREE.BoxGeometry(1, 1, 1);
  const uv = g.attributes.uv, cw = 1 / 32, u0 = ci * cw;
  const cell = (face, a, b, c, d, rot) => {
    for (let k = 0; k < 4; k++) {
      const i = face * 4 + k, U = uv.getX(i), V = uv.getY(i);
      const uu = rot ? V : U, vv = rot ? U : V;
      uv.setXY(i, a + uu * (b - a), c + vv * (d - c));
    }
  };
  const SP = [u0 + .002, u0 + cw - .002, 0.11, 0.99], PLAIN = [u0 + .004, u0 + .006, 0.12, 0.14], PAGE = [0.1, 0.9, 0.0, 0.08];
  if (!flat) {
    cell(4, ...SP, false); cell(5, ...PAGE, false); cell(0, ...PLAIN); cell(1, ...PLAIN); cell(2, ...PAGE); cell(3, ...PAGE);
  } else {
    cell(4, ...SP, true); cell(5, ...PAGE); cell(2, ...PLAIN); cell(3, ...PLAIN); cell(0, ...PAGE); cell(1, ...PAGE);
  }
  const m = flat ? mat(x, y + th / 2, z, 0, ry, rz, h, th, dp) : mat(x, y + h / 2, z, 0, ry, rz, th, h, dp);
  let gg = g.toNonIndexed(); gg.applyMatrix4(m);
  const n = gg.attributes.position.count, ca = new Float32Array(n * 3).fill(1); gg.setAttribute('color', new THREE.BufferAttribute(ca, 3));
  bookGeo.push(gg);
}
function bookRow(x0, x1, y, zBack, opt = {}) {
  let x = x0;
  while (x < x1 - 0.008) {
    const th = rr(opt.thMin ?? 0.008, opt.thMax ?? 0.022), h = rr(opt.hMin ?? 0.2, opt.hMax ?? 0.3), dp = rr(0.17, 0.24);
    if (x + th > x1) break;
    book(x + th / 2, y, zBack + dp / 2, th, h, dp, opt.cols ? pick(opt.cols) : Math.floor(rnd() * 32), { rz: rr(-0.02, 0.02) });
    x += th + rr(0, 0.002);
  }
  return x;
}
function bookPile(x, y, z, n, w = 0.26, dp = 0.2, tilt = 0) {
  let yy = y;
  for (let i = 0; i < n; i++) { const th = rr(0.008, 0.02); book(x + rr(-.02, .02) + i * tilt * 0.06, yy, z, th, w + rr(-.03, .03), dp + rr(-.02, .02), Math.floor(rnd() * 32), { flat: true, ry: rr(-.15, .15), rz: tilt * rr(0.5, 1.2) }); yy += th; }
  return yy;
}

}
