<script type="module">
import * as THREE from 'three';

const Q = new URLSearchParams(location.search);
const SHOT = Q.get('shot'), FIXT = Q.has('t') ? parseFloat(Q.get('t')) : null, CLEAN = Q.has('clean');
if (CLEAN) document.getElementById('hud').style.display = 'none';

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ea);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
RectAreaLightUniformsLib.init();

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 40);

// ---------- helpers ----------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => a + (b - a) * rnd();
const pick = a => a[Math.floor(rnd() * a.length)];
function canvasTex(w, h, draw, repeat, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const M = (o) => new THREE.MeshStandardMaterial(o);
const geoBox = new THREE.BoxGeometry(1, 1, 1);
function box(w, h, d, mat, x, y, z, parent = scene, cast = true) {
  const m = new THREE.Mesh(geoBox, mat); m.scale.set(w, h, d); m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true; parent.add(m); return m;
}
function noise(g, w, h, n, a, col = '0,0,0') { for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${col},${rnd() * a})`; g.fillRect(rnd() * w, rnd() * h, R(1, 3), R(1, 3)); } }

// ---------- room dims ----------
const X0 = -1.6, X1 = 1.6, Z0 = -1.6, Z1 = 1.6, H = 2.6;

// ---------- materials ----------
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#40352c'; g.fillRect(0, 0, w, h);
  const rows = 8, ph = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rnd() * w;
    while (x < w) {
      const pw = w * R(0.7, 1.0), base = R(50, 64);
      const gr = g.createLinearGradient(x, 0, x + pw, 0);
      gr.addColorStop(0, `rgb(${base + 12},${base},${base - 10})`); gr.addColorStop(1, `rgb(${base + 4},${base - 6},${base - 16})`);
      g.fillStyle = gr; g.fillRect(x, r * ph, pw, ph);
      for (let k = 0; k < 40; k++) { g.strokeStyle = `rgba(${rnd() < .5 ? '20,15,12' : '110,95,80'},${R(.05, .18)})`; g.lineWidth = R(.5, 2); const yy = r * ph + rnd() * ph; g.beginPath(); g.moveTo(x, yy); g.bezierCurveTo(x + pw * .3, yy + R(-4, 4), x + pw * .6, yy + R(-4, 4), x + pw, yy + R(-3, 3)); g.stroke(); }
      g.fillStyle = 'rgba(10,8,6,.85)'; g.fillRect(x, r * ph, 2, ph);
      x += pw;
    }
    g.fillStyle = 'rgba(10,8,6,.9)'; g.fillRect(0, r * ph, w, 2);
  }
}, [2.2, 2.2 * 6.4 / 1.44 / 4]);
floorTex.center.set(.5,.5); floorTex.rotation = Math.PI / 2;
const floorMat = M({ map: floorTex, roughness: 0.42, metalness: 0, envMapIntensity: 0.9 });

function wallTex(dark) { return canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#f1f0ec'; g.fillRect(0, 0, w, h); const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(60,55,50,.07)'); gr.addColorStop(.25, 'rgba(0,0,0,0)'); gr.addColorStop(.8, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(60,55,50,.1)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); noise(g, w, h, 6000, .025); }); }
const wallMat = M({ color: 0xeeebe6, map: wallTex(), roughness: 0.92 });
const ceilMat = M({ color: 0xf4f4f2, roughness: 0.95 });
const skirtMat = M({ color: 0x2d2a28, roughness: 0.6 });
const oakTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#c9a77f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) { g.strokeStyle = `rgba(${rnd() < .6 ? '120,85,50' : '230,205,170'},${R(.06, .22)})`; g.lineWidth = R(.5, 2.5); const y = rnd() * h; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * .3, y + R(-6, 6), w * .7, y + R(-6, 6), w, y + R(-5, 5)); g.stroke(); }
}, [1, 1]);
const oakMat = M({ map: oakTex, roughness: 0.6 });
const oakDarkMat = M({ map: oakTex, color: 0xb59573, roughness: 0.7 });
const glossWhite = M({ color: 0xf6f6f4, roughness: 0.12, metalness: 0, envMapIntensity: 1.2 });
const matteWhite = M({ color: 0xf2f2f0, roughness: 0.55 });
const black = M({ color: 0x141414, roughness: 0.45 });
const blackMatte = M({ color: 0x1a1a1b, roughness: 0.8 });
const deskMat = M({ color: 0x1b1c1e, roughness: 0.38, metalness: 0.05, envMapIntensity: 0.9 });
const metalDark = M({ color: 0x2a2b2d, roughness: 0.35, metalness: 0.7 });
const paperMat = M({ color: 0xf3f2ee, roughness: 0.9 });
const cardboard = M({ map: canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#b9926a'; g.fillRect(0, 0, w, h); noise(g, w, h, 900, .08); g.fillStyle = 'rgba(80,55,30,.25)'; g.fillRect(0, h * .45, w, h * .1); }), roughness: 0.9 });

// ---------- room shell ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(X1 - X0, Z1 - Z0), floorMat);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
// corridor floor (light tiles)
const corrMat = M({ color: 0xe9e6df, roughness: 0.25, envMapIntensity: 1 });
const corr = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 3.0), corrMat); corr.rotation.x = -Math.PI / 2; corr.position.set(-1.0, 0.001, -3.1); corr.receiveShadow = true; scene.add(corr);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), ceilMat); ceil.rotation.x = Math.PI / 2; ceil.position.set(0, H, -1); scene.add(ceil);

function wallWithHoles(len, holes) { // wall in XY, origin at left bottom, holes [x0,x1,y0,y1]
  const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(len, 0); s.lineTo(len, H); s.lineTo(0, H); s.lineTo(0, 0);
  for (const [a, b, c, d] of holes) { const p = new THREE.Path(); p.moveTo(a, c); p.lineTo(b, c); p.lineTo(b, d); p.lineTo(a, d); p.lineTo(a, c); s.holes.push(p); }
  const g = new THREE.ShapeGeometry(s); const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 2, uv.getY(i) / H);
  const m = new THREE.Mesh(g, wallMat); m.receiveShadow = true; return m;
}
// North wall (z=Z0) facing +z: door hole x -1.52..-0.72
const DOOR0 = -1.52, DOOR1 = -0.74, DOORH = 2.08;
const wN = wallWithHoles(X1 - X0, [[DOOR0 - X0, DOOR1 - X0, 0, DOORH]]); wN.position.set(X0, 0, Z0); scene.add(wN);
// South wall (z=Z1) facing -z: window x -0.25..1.5, y 0.98..2.28
const WIN0 = -0.05, WIN1 = 1.52, WY0 = 0.98, WY1 = 2.3;

const wE = wallWithHoles(Z1 - Z0, []); wE.rotation.y = -Math.PI / 2; wE.position.set(X1, 0, Z0); scene.add(wE);
const wW = wallWithHoles(Z1 - Z0, []); wW.rotation.y = Math.PI / 2; wW.position.set(X0, 0, Z1); scene.add(wW);
// thickness + reveals for door / window
box(0.12, H, 0.02, wallMat, DOOR0 - 0.06, H / 2, Z0 - 0.06); // filler
const revealMat = M({ color: 0xf0efea, roughness: 0.8 });
box(0.03, DOORH, 0.14, revealMat, DOOR0 - 0.015, DOORH / 2, Z0 - 0.07);
box(0.03, DOORH, 0.14, revealMat, DOOR1 + 0.015, DOORH / 2, Z0 - 0.07);
box(DOOR1 - DOOR0 + 0.06, 0.03, 0.14, revealMat, (DOOR0 + DOOR1) / 2, DOORH + 0.015, Z0 - 0.07);
// architraves
const archMat = M({ color: 0xf7f7f5, roughness: 0.5 });
box(0.05, DOORH + 0.05, 0.015, archMat, DOOR0 - 0.025, (DOORH + 0.05) / 2, Z0 + 0.008);
box(0.05, DOORH + 0.05, 0.015, archMat, DOOR1 + 0.025, (DOORH + 0.05) / 2, Z0 + 0.008);
box(DOOR1 - DOOR0 + 0.1, 0.05, 0.015, archMat, (DOOR0 + DOOR1) / 2, DOORH + 0.025, Z0 + 0.008);
// skirting
const SK = 0.08;
box(X1 - X0, SK, 0.012, skirtMat, 0, SK / 2, Z1 - 0.006, scene, false);
box(0.012, SK, Z1 - Z0, skirtMat, X1 - 0.006, SK / 2, 0, scene, false);
box(0.012, SK, Z1 - Z0, skirtMat, X0 + 0.006, SK / 2, 0, scene, false);
box(DOOR0 - X0, SK, 0.012, skirtMat, (X0 + DOOR0) / 2, SK / 2, Z0 + 0.006, scene, false);
// corridor beyond door
const cW = 1.5;
box(0.02, H, 3, wallMat, DOOR0 - 0.15, H / 2, Z0 - 1.6, scene, false);
box(0.02, H, 3, wallMat, DOOR1 + 0.9, H / 2, Z0 - 1.6, scene, false);
box(3, 0.02, 3, ceilMat, -1, H, Z0 - 1.6, scene, false);
box(3, H, 0.02, wallMat, -1, H / 2, Z0 - 3.0, scene, false);
const maroon = M({ color: 0x4a2620, roughness: 0.55 });
box(0.85, 2.05, 0.04, maroon, DOOR0 + 0.25, 1.025, Z0 - 2.97);  // far maroon door
box(0.02, 2.0, 0.85, maroon, DOOR0 - 0.13, 1.0, Z0 - 1.9);       // side door on corridor left
box(0.03, 0.08, 3, skirtMat, DOOR0 - 0.13, 0.04, Z0 - 1.6, scene, false);
box(0.03, 0.08, 3, skirtMat, DOOR1 + 0.89, 0.04, Z0 - 1.6, scene, false);
const corrLight = new THREE.PointLight(0xfff3e6, 1.4, 4, 2); corrLight.position.set(-1.0, 2.3, Z0 - 1.8); scene.add(corrLight);

// AC unit high on north wall above doorway / left of shelf
const acMat = M({ color: 0xeceae4, roughness: 0.45 });
const ac = new THREE.Group(); scene.add(ac);
box(0.95, 0.29, 0.22, acMat, 0, 0, 0, ac); box(0.9, 0.03, 0.15, M({ color: 0xd6d4ce, roughness: .6 }), 0, -0.13, 0.05, ac);
ac.position.set(-1.05, 2.35, Z0 + 0.12);

// ---------- door leaf (opened inward against west wall) ----------
const doorWood = M({ map: canvasTex(256, 512, (g, w, h) => { g.fillStyle = '#9a4a2c'; g.fillRect(0, 0, w, h); for (let i = 0; i < 120; i++) { g.strokeStyle = `rgba(${rnd() < .5 ? '90,35,15' : '190,110,70'},${R(.05, .2)})`; g.lineWidth = R(.5, 2); const x = rnd() * w; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + R(-6, 6), h * .3, x + R(-6, 6), h * .7, x + R(-4, 4), h); g.stroke(); } }), roughness: 0.5 });
const doorPivot = new THREE.Group(); doorPivot.position.set(DOOR0 + 0.01, 0, Z0 + 0.02); scene.add(doorPivot);
const leaf = box(0.78, 2.04, 0.04, doorWood, 0.39, 1.02, 0, doorPivot);
doorPivot.rotation.y = -0.8; // swung into room toward west wall
const handle = box(0.12, 0.02, 0.02, M({ color: 0xc8c8c8, metalness: 1, roughness: .25 }), 0.68, 1.0, 0.045, doorPivot);
box(0.12, 0.02, 0.02, handle.material, 0.68, 1.0, -0.045, doorPivot);
// socket on west wall
box(0.012, 0.08, 0.13, matteWhite, X0 + 0.006, 0.3, 0.2);

// ---------- built-in shelf wall (north) ----------
const SH0 = -0.6, SH1 = 0.83, SD = 0.42, SZ = Z0 + SD; // front plane z
const shelf = new THREE.Group(); scene.add(shelf);
// plinth + base cabinets
box(SH1 - SH0, 0.07, SD - 0.04, oakDarkMat, (SH0 + SH1) / 2, 0.035, Z0 + SD / 2 - 0.02, shelf);
const baseH = 0.62, baseTop = 0.07 + baseH;
box(SH1 - SH0, baseH, SD, matteWhite, (SH0 + SH1) / 2, 0.07 + baseH / 2, Z0 + SD / 2, shelf);
box(0.004, baseH - 0.02, 0.005, M({ color: 0xcfcfcd }), (SH0 + SH1) / 2 - 0.15, 0.07 + baseH / 2, SZ + 0.001, shelf, false);
box(SH1 - SH0, 0.03, SD + 0.01, oakMat, (SH0 + SH1) / 2, baseTop + 0.015, Z0 + SD / 2, shelf); // counter
// top cabinets (gloss) up to ceiling
const topY0 = 2.2;
box(SH1 - SH0 + 0.084, H - topY0, SD, glossWhite, (SH0 + SH1) / 2 + 0.05, topY0 + (H - topY0) / 2, Z0 + SD / 2, shelf);
box(0.004, H - topY0 - 0.02, 0.005, M({ color: 0xc9c9c7 }), (SH0 + SH1) / 2 + 0.05, topY0 + (H - topY0) / 2, SZ + 0.001, shelf, false);
box(SH1 - SH0, 0.025, SD, oakMat, (SH0 + SH1) / 2, topY0 - 0.012, Z0 + SD / 2, shelf);
// back panel in oak for open part
const back = box(SH1 - SH0, topY0 - baseTop, 0.015, oakMat, (SH0 + SH1) / 2, (topY0 + baseTop) / 2, Z0 + 0.008, shelf, false);
// left side panel oak
box(0.025, topY0 - baseTop, SD, oakMat, SH0 + 0.010, (topY0 + baseTop) / 2, Z0 + SD / 2, shelf);
// horizontal shelves
const levels = [baseTop + 0.03, 1.24, 1.52, 1.83];
for (const y of levels.slice(1)) box(SH1 - SH0, 0.025, SD - 0.02, oakMat, (SH0 + SH1) / 2, y, Z0 + SD / 2, shelf);
// verticals between book shelf section
box(0.022, 1.24 - baseTop, SD - 0.02, oakMat, SH0 + 0.798, (1.24 + baseTop) / 2, Z0 + SD / 2, shelf);
box(0.022, 1.24 - baseTop, SD - 0.02, oakMat, SH0 + 0.353, (1.24 + baseTop) / 2, Z0 + SD / 2, shelf);
box(0.022, 1.24 - 0.85, SD - 0.02, oakMat, SH0 + 1.134, (1.24 + 0.85) / 2, Z0 + SD / 2, shelf);
box(0.82, 0.022, SD - 0.02, oakMat, SH0 + 0.764, 0.95, Z0 + SD / 2, shelf);
// white gloss inset blocks
box(0.5, 0.28, SD - 0.01, glossWhite, SH0 + 0.260, 1.24 - 0.145, Z0 + SD / 2 + 0.005, shelf); // left box door at book level
box(0.34, 0.32, SD - 0.01, glossWhite, SH1 - 0.168, 1.52 + 0.16 + 0.012, Z0 + SD / 2 + 0.005, shelf); // top right block (shelf 1.52-1.83 right)
box(0.36, 0.5, SD - 0.01, glossWhite, SH1 - 0.176, 1.83 + 0.26, Z0 + SD / 2 + 0.005, shelf);
box(0.2, 0.11, SD - 0.03, matteWhite, SH1 - 0.092, 0.97, Z0 + SD / 2, shelf);
// black steel post at right
box(0.05, H, 0.05, blackMatte, SH1 + 0.03, H / 2, SZ - 0.02, scene);
box(0.05, H, 0.05, blackMatte, SH0 - 0.03, H / 2, SZ - 0.02, scene);
box(0.03, 0.03, SD, blackMatte, SH1 + 0.03, 1.83, Z0 + SD / 2, scene);

// books (instanced)
const bookGeo = new THREE.BoxGeometry(1, 1, 1);
const spineTex = canvasTex(64, 256, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, h * .1, w, 6); g.fillRect(0, h * .85, w, 10); g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(w * .3, h * .3, w * .4, h * .35); });
const bookMat = M({ map: spineTex, roughness: 0.6 });
const bookCols = [0xd43b2e, 0x2f7fd6, 0xf1c232, 0x3aa65a, 0xef7d2b, 0x7b4fc0, 0xe94e8a, 0x1f9bb0, 0xffffff, 0x2a3c8f, 0xf4e04d, 0x56b84c, 0xc0392b, 0x4fa3e0, 0xeeeeee];
const books = []; // [w,h,d,x,y,z,rx,rz,color]
function bookRow(x0, x1, y, zBack, maxH, lean = true) {
  let x = x0;
  while (x < x1 - 0.012) {
    const t = R(0.008, 0.028), hh = R(maxH * 0.7, maxH), d = R(0.15, 0.24);
    if (x + t > x1) break;
    const tilt = lean && rnd() < .08 ? R(-.15, .15) : 0;
    books.push([t, hh, d, x + t / 2, y + hh / 2, zBack + d / 2 + 0.03, 0, tilt, pick(bookCols)]);
    x += t + R(0, 0.003);
  }
}
function bookPile(x, y, z, n, w, d) { let yy = y; for (let i = 0; i < n; i++) { const t = R(0.006, 0.02); books.push([w * R(.9, 1.05), t, d * R(.9, 1.05), x + R(-.01, .01), yy + t / 2, z, 0, 0, pick(bookCols), R(-.2, .2)]); yy += t; } return yy; }
// lower book section (baseTop..0.86): left part with leaning picture-book piles, middle mags, right
const yb = baseTop + 0.03;
let py = yb; for (let i = 0; i < 3; i++) { py = bookPile(SH0 + 0.185, py, Z0 + 0.22, 3, 0.26, 0.22); }
bookRow(SH0 + 0.370, SH0 + 0.773, yb, Z0 + 0.05, 0.23);
bookRow(SH0 + 0.823, SH0 + 1.092, yb, Z0 + 0.05, 0.22);
bookPile(SH0 + 1.260, yb, Z0 + 0.22, 6, 0.24, 0.2);
// middle book section (0.86..1.24)
bookRow(SH0 + 0.538, SH0 + 1.008, 0.963, Z0 + 0.05, 0.25);
bookRow(SH0 + 0.521, SH0 + 0.554, 0.963, Z0 + 0.05, 0.25, false);
bookPile(SH0 + 1.245, 0.963, Z0 + 0.22, 5, 0.2, 0.2);
const bookInst = new THREE.InstancedMesh(bookGeo, bookMat, books.length);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _c = new THREE.Color();
books.forEach((b, i) => { _e.set(0, b[9] || 0, b[7]); _q.setFromEuler(_e); _s.set(b[0], b[1], b[2]); _p.set(b[3], b[4], b[5]); _m.compose(_p, _q, _s); bookInst.setMatrixAt(i, _m); bookInst.setColorAt(i, _c.setHex(b[8])); });
bookInst.castShadow = bookInst.receiveShadow = true; scene.add(bookInst);
// magazine file white boxes on lower right
box(0.09, 0.22, 0.26, matteWhite, SH0 + 1.361, yb + 0.11, Z0 + 0.2);

// clock
const clockTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#fafafa'; g.beginPath(); g.arc(128, 128, 126, 0, 7); g.fill();
  g.fillStyle = '#333'; g.font = '600 30px Helvetica,Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 1; i <= 12; i++) { const a = i / 12 * Math.PI * 2; g.fillText(i, 128 + Math.sin(a) * 96, 128 - Math.cos(a) * 96); }
  g.strokeStyle = '#222'; g.lineCap = 'round'; g.lineWidth = 7; g.beginPath(); g.moveTo(128, 128); g.lineTo(128 + 50 * Math.sin(3.6), 128 - 50 * Math.cos(3.6)); g.stroke();
  g.lineWidth = 5; g.beginPath(); g.moveTo(128, 128); g.lineTo(128 + 80 * Math.sin(0.65), 128 - 80 * Math.cos(0.65)); g.stroke();

  const cr = (a, b, c, d) => { const u2 = u * u, u3 = u2 * u; return 0.5 * ((2 * b) + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u2 + (-a + 3 * b - 3 * c + d) * u3); };
  const out = []; for (let j = 1; j < 6; j++) out.push(cr(k0[j], k1[j], k2[j], k3[j]));
  return out;
}

function tick() {
  const now = performance.now(), dt = Math.min(0.1, (now - prev) / 1000); prev = now; clockT += dt;
