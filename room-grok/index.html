        g.stroke();

        const kx = x + rr(0.2, 0.8) * pw, ky = y + rnd() * L;

  for (let k = 0; k < 420; k++) {

function wallTex(w, h, opts = {}) {

const bookGeo = [];
function book(x, y, z, th, h, dp, ci, { flat = false, ry = 0, rz = 0 } = {}) {
  const g = new THREE.BoxGeometry(1, 1, 1);
  const uv = g.attributes.uv, cw = 1 / 32, u0 = ci * cw;
  const cell = (face, a, b, c, d, rot) => {
    for (let k = 0; k < 4; k++) {
      const i = face * 4 + k, U = uv.getX(i), V = uv.getY(i);
      const uu = rot ? V : U, vv = rot ? U : V;
      uv.setXY(i, a + uu * (b - a), c + vv * (d - c));
    }
  };
  const SP = [u0 + .002, u0 + cw - .002, 0.11, 0.99], PLAIN = [u0 + .004, u0 + .006, 0.12, 0.14], PAGE = [0.1, 0.9, 0.0, 0.08];
  if (!flat) {
    cell(4, ...SP, false); cell(5, ...PAGE, false); cell(0, ...PLAIN); cell(1, ...PLAIN); cell(2, ...PAGE); cell(3, ...PAGE);
  } else {
    cell(4, ...SP, true); cell(5, ...PAGE); cell(2, ...PLAIN); cell(3, ...PLAIN); cell(0, ...PAGE); cell(1, ...PAGE);
  }
  const m = flat ? mat(x, y + th / 2, z, 0, ry, rz, h, th, dp) : mat(x, y + h / 2, z, 0, ry, rz, th, h, dp);
  let gg = g.toNonIndexed(); gg.applyMatrix4(m);
  const n = gg.attributes.position.count, ca = new Float32Array(n * 3).fill(1); gg.setAttribute('color', new THREE.BufferAttribute(ca, 3));
  bookGeo.push(gg);
}
function bookRow(x0, x1, y, zBack, opt = {}) {
  let x = x0;
  while (x < x1 - 0.008) {
    const th = rr(opt.thMin ?? 0.008, opt.thMax ?? 0.022), h = rr(opt.hMin ?? 0.2, opt.hMax ?? 0.3), dp = rr(0.17, 0.24);
    if (x + th > x1) break;
    book(x + th / 2, y, zBack + dp / 2, th, h, dp, opt.cols ? pick(opt.cols) : Math.floor(rnd() * 32), { rz: rr(-0.02, 0.02) });
    x += th + rr(0, 0.002);
  }
  return x;
}
function bookPile(x, y, z, n, w = 0.26, dp = 0.2, tilt = 0) {

}

  blob(0.5, (1.32 + D) / 2, 1.2, D - 1.2, 0.8);
  blob(W - 0.38, DESK_Z0 + 0.1, 0.9, 0.3, 0.6);
  blob(2.3, 3.08, 0.45, 0.45, 0.9);
  blob(2.14, SH_D + 0.3, 0.65, 0.5, 0.9); blob(2.62, SH_D + 0.32, 0.5, 0.5, 0.7);
  // floor-edge AO strips along walls
  const [c2, g2] = cnv(4, 64); const gr2 = g2.createLinearGradient(0, 0, 0, 64); gr2.addColorStop(0, 'rgba(0,0,0,0.38)'); gr2.addColorStop(1, 'rgba(0,0,0,0)'); g2.fillStyle = gr2; g2.fillRect(0, 0, 4, 64);
  const t2 = new THREE.CanvasTexture(c2);
  const strip = (x, z, len, ry) => { const p = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.3), new THREE.MeshBasicMaterial({ map: t2, transparent: true, depthWrite: false, toneMapped: false }));
    p.rotation.order = 'YXZ'; p.rotation.y = ry; p.rotation.x = -Math.PI / 2; p.position.set(x, 0.002, z); scene.add(p); };
  strip(W / 2, D - 0.15, W, Math.PI); strip(0.15, D / 2, D, -Math.PI / 2); strip(W - 0.15, D / 2, D, Math.PI / 2);
  // soft shadow under each shelf board on the back panel (cubby AO)
  const aoM = new THREE.MeshBasicMaterial({ map: t2, transparent: true, depthWrite: false, toneMapped: false, opacity: 1.0 });
  for (const y of [L.l2, L.l3, L.l4, L.l5, L.top - 0.02]) {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(SH_X1 - SH_X0 - 0.05, 0.26), aoM); p.position.set((SH_X0 + SH_X1) / 2, y - 0.13, 0.02); scene.add(p);
    const p2 = p.clone(); p2.position.y = y - 0.1; p2.position.z = 0.021; scene.add(p2);
  }
}

// ---------------------------------------------------------------- build batches
for (const k of Object.keys(B)) B[k].build();
{ const bm = new THREE.Mesh(mergeGeometries(bookGeo), MAT.books); bm.castShadow = bm.receiveShadow = true; scene.add(bm); }

// ---------------------------------------------------------------- lighting (overcast window light)
const hemi = new THREE.HemisphereLight(0xeef2fa, 0xb08a6a, 0.28)   // ground colour = warm bounce off the wood floor; scene.add(hemi);
const amb = new THREE.AmbientLight(0xfff8f0, 0.08); scene.add(amb);
const winLight = new THREE.RectAreaLight(0xeef4ff, 10.5, WIN_X1 - WIN_X0, WIN_Y1 - WIN_Y0);
winLight.position.set((WIN_X0 + WIN_X1) / 2, (WIN_Y0 + WIN_Y1) / 2, D - 0.02); winLight.lookAt((WIN_X0 + WIN_X1) / 2, (WIN_Y0 + WIN_Y1) / 2, 0); scene.add(winLight);
// soft bounce from floor/ceiling folded into the hemisphere + a dim fill from the room centre
const fill = new THREE.PointLight(0xfff4ea, 0.55, 6, 1.2); fill.position.set(1.7, 2.3, 2.0); scene.add(fill);
const sofaBleed = new THREE.PointLight(0xff6a3c, 0.4, 1.3, 2); sofaBleed.position.set(1.25, 0.18, 2.45); scene.add(sofaBleed);   // orange bounce from the sofa onto wall/floor
const sun = new THREE.DirectionalLight(0xf2f6ff, 0.6);
sun.position.set(1.65, H - 0.08, 2.9); sun.target.position.set(1.85, 0.0, 1.2);   // inside the room: soft contact shadows, no window-frame banding scene.add(sun, sun.target);
sun.castShadow = Q.get('noshadow') !== '1'; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.radius = 6;
Object.assign(sun.shadow.camera, { left: -2.6, right: 2.6, top: 2.4, bottom: -2.4, near: 0.1, far: 6 });
sun.shadow.camera.updateProjectionMatrix();

// ---------------------------------------------------------------- reflection probe: render the finished room once into a cube map
{
  const cubeRT = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType });
  const cubeCam = new THREE.CubeCamera(0.05, 30, cubeRT);
  cubeCam.position.set(1.7, 1.3, 2.0); scene.add(cubeCam);
  cubeCam.update(renderer, scene);
  const env = pmrem.fromCubemap(cubeRT.texture).texture;
  scene.environment = env; scene.environmentIntensity = 0.42;
  cubeRT.dispose();
}

// ---------------------------------------------------------------- post: bloom + phone-camera grade
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 2 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
// screen-space ambient occlusion (GTAO) at half resolution: corners, under shelves, around objects
const gtao = new GTAOPass(scene, camera, 360, 640);
gtao.updateGtaoMaterial({ radius: 0.22, distanceExponent: 1.4, thickness: 1.0, scale: 1.2, samples: 12 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 12, rings: 3, samples: 16 });
gtao.blendIntensity = 0.8;
// (full resolution: the half-res variant left visible blotches on flat white panels)
composer.addPass(gtao);
if (Q.get('noao') === '1') gtao.enabled = false;
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.21, 0.38, 1.55);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uVig: { value: 0.3 }, uT: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uVig; uniform float uT; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uT) * 43758.5453); }
    void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 px=1.0/vec2(textureSize(tDiffuse,0)); vec3 nb=(texture2D(tDiffuse,vUv+vec2(px.x,0.)).rgb+texture2D(tDiffuse,vUv-vec2(px.x,0.)).rgb+texture2D(tDiffuse,vUv+vec2(0.,px.y)).rgb+texture2D(tDiffuse,vUv-vec2(0.,px.y)).rgb)*0.25; vec3 col=mix(c.rgb,nb,0.42);   // phone-video softness (Grok v2)
      col = col*vec3(1.015,1.0,0.985);
      col = col * 0.955 + vec3(0.032, 0.034, 0.038);          // phone-camera lifted blacks
      col = mix(col, smoothstep(0.0, 1.0, col), 0.18);          // gentle S-curve
      float l=dot(col,vec3(0.299,0.587,0.114)); col=mix(vec3(l),col,1.06);
      vec2 d=vUv-0.5; col*=1.0-uVig*dot(d,d)*2.2;
      float n = h(gl_FragCoord.xy) - 0.5; vec3 cn = vec3(h(gl_FragCoord.xy + 17.1), h(gl_FragCoord.xy + 41.7), h(gl_FragCoord.xy + 73.3)) - 0.5;
      col += n * 0.026 + cn * 0.01 * (1.0 - l);                   // luma + faint chroma sensor noise, more in shadows
      gl_FragColor=vec4(col,1.0); }`
});
composer.addPass(grade);

// ---------------------------------------------------------------- camera poses & pan
// yaw: degrees clockwise from north (shelf). pitch: + up. roll: + clockwise.
const SHOTS = {
  S1: { t: 0.2, p: [1.54, 1.422, 2.774], yaw: 0.9, pitch: -5, roll: -1.9 },
  S2: { t: 2.6, p: [1.834, 1.207, 2.019], yaw: 77.4, pitch: -4.6, roll: 2 },
  S3: { t: 3.8, p: [1.863, 1.17, 1.68], yaw: 139.5, pitch: -5.7, roll: 3.1 },
  S4: { t: 5.6, p: [0.948, 0.845, 1.501], yaw: 201.9, pitch: 0.4, roll: -7.3 },
  S5: { t: 8.0, p: [1.454, 1.109, 2.211], yaw: 332.4, pitch: -9, roll: -0.9 },
};
const KEYS = [
  { t: 0.0, yaw: -2, pitch: -5, roll: -1, p: SHOTS.S1.p },
  SHOTS.S1,
  { t: 0.6, yaw: 2, pitch: -4, roll: 0 },
  { t: 1.0, yaw: 14, pitch: -6, roll: 1 },
  { t: 1.5, yaw: 36, pitch: -10, roll: 1 },
  { t: 2.0, yaw: 55, pitch: -12, roll: 2 },
  SHOTS.S2,
  { t: 3.2, yaw: 105, pitch: -12, roll: 0 },
  SHOTS.S3,
  { t: 4.4, yaw: 172, pitch: -5, roll: -1 },
  { t: 5.0, yaw: 200, pitch: -3, roll: 0 },
  SHOTS.S4,
  { t: 6.2, yaw: 258, pitch: -10, roll: 1 },
  { t: 7.0, yaw: 272, pitch: -14, roll: 0 },
  { t: 7.5, yaw: 296, pitch: -12, roll: 2 },
  SHOTS.S5,
  { t: 8.5, yaw: 348, pitch: -6, roll: 1 },
  { t: 9.0, yaw: 356, pitch: -3, roll: 0 },
  { t: 10.5, yaw: 358, pitch: -5, roll: -1, p: SHOTS.S1.p },
];
// fill missing positions by time-lerp between neighbouring keys that have one
KEYS.forEach((k, i) => {
  if (k.p) return; let a = i - 1, b = i + 1; while (!KEYS[a].p) a--; while (!KEYS[b].p) b++;
  const u = (k.t - KEYS[a].t) / (KEYS[b].t - KEYS[a].t); k.p = KEYS[a].p.map((v, j) => v + (KEYS[b].p[j] - v) * u);
});
function catmull(p0, p1, p2, p3, t) { const t2 = t * t, t3 = t2 * t; return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3); }
function poseAt(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  let i = 0; while (i < KEYS.length - 2 && KEYS[i + 1].t <= t) i++;
  const k0 = KEYS[Math.max(0, i - 1)], k1 = KEYS[i], k2 = KEYS[i + 1], k3 = KEYS[Math.min(KEYS.length - 1, i + 2)];
  const u = (t - k1.t) / (k2.t - k1.t);
  const f = key => catmull(k0[key], k1[key], k2[key], k3[key], u);
  return { yaw: f('yaw'), pitch: f('pitch'), roll: f('roll'),
    p: [0, 1, 2].map(j => catmull(k0.p[j], k1.p[j], k2.p[j], k3.p[j], u)) };
}
function applyPose(P, wob = 0, tt = 0) {
  camera.position.set(P.p[0], P.p[1], P.p[2]);
  const wy = wob * (Math.sin(tt * 1.7) * 0.5 + Math.sin(tt * 3.1 + 1) * 0.3);
  const wp = wob * (Math.sin(tt * 2.3 + 2) * 0.5 + Math.sin(tt * 4.7) * 0.25);
  const wr = wob * Math.sin(tt * 1.3 + .5) * 0.6;
  camera.rotation.set((P.pitch + wp) * DEG, -(P.yaw + wy) * DEG, -(P.roll + wr) * DEG, 'YXZ');
  if (wob) camera.position.y += Math.sin(tt * 2.9) * 0.006 * wob;
}

// ---------------------------------------------------------------- resize / fov
function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  camera.aspect = a;
  camera.fov = a <= 1 ? 70 : Math.max(48, Math.min(70, 2 * Math.atan(Math.tan(46 * DEG) / a) / DEG));
  camera.updateProjectionMatrix();
  // pixel budget: never render more than ~2.1 MP (e.g. a 4K or retina fullscreen) so GTAO stays affordable
  const pr = Math.min(PR, Math.sqrt(2.1e6 / (w * h)));
  renderer.setPixelRatio(pr); renderer.setSize(w, h); composer.setPixelRatio(pr); composer.setSize(w, h);
  bloom.resolution.set(w * pr / 2, h * pr / 2);
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- interaction
let paused = false, playT = 0, dragYaw = 0, dragPitch = 0, lastInteract = -1e9, down = null, moved = false;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, yaw: dragYaw, pitch: dragPitch }; moved = false; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e => {
  if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
  if (moved) { dragYaw = down.yaw - dx * 0.15; dragPitch = Math.max(-60, Math.min(60, down.pitch + dy * 0.12)); lastInteract = performance.now(); }
});
el.addEventListener('pointerup', () => { if (down && !moved && !SHOT && TQ === null) paused = !paused; down = null; lastInteract = performance.now(); });

// ---------------------------------------------------------------- loop
const fpsEl = document.getElementById('fps');
let last = performance.now(), fc = 0, ft = last, frames = 0, lowFor = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  let pose, wob = 0;
  if (SHOT && SHOTS[SHOT]) {
    pose = SHOTS[SHOT];
    if (POSEOFF) pose = { ...pose, yaw: pose.yaw + POSEOFF[0], pitch: pose.pitch + POSEOFF[1], p: [pose.p[0] + POSEOFF[2], pose.p[1], pose.p[2] + POSEOFF[3]] };
  }
  else if (TQ !== null) pose = poseAt(TQ);
  else { if (!paused) playT += dt; pose = poseAt(playT); wob = 1; }
  if (now - lastInteract > 3000 && !down) { dragYaw *= 0.94; dragPitch *= 0.94; }
  const P = { ...pose, yaw: pose.yaw + dragYaw, pitch: pose.pitch + dragPitch };
  applyPose(P, wob, playT);
  grade.uniforms.uT.value = (SHOT || TQ !== null) ? 0.0 : (now % 1000) * 0.001;
  composer.render();
  frames++; fc++;
  if (now - ft > 500) {
    window.__fps = Math.round(fc * 1000 / (now - ft)); fc = 0; ft = now; fpsEl.textContent = window.__fps + ' fps';
    // adaptive quality for phones/tablets: drop pixel ratio first, then bloom (never during fixed test shots)
    if (window.__fps < 40 && !SHOT && TQ === null && (PR > 1 || gtao.enabled || bloom.enabled)) {
      if (++lowFor > 4) { if (PR > 1) { PR = 1; resize(); } else if (gtao.enabled) gtao.enabled = false; else bloom.enabled = false; lowFor = 0; }
    } else lowFor = 0;
  }
  if (frames === 3) window.__ready = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
