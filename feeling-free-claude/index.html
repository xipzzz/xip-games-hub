<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- params
const Q = new URLSearchParams(location.search);
const SHOTS = { S1: 0.0, S2: 1.4, S3: 3.5, S4: 5.6, S5: 6.9 };
let frozenT = null;
if (Q.has('shot') && SHOTS[Q.get('shot').toUpperCase()] !== undefined) frozenT = SHOTS[Q.get('shot').toUpperCase()];
else if (Q.has('t')) { const v = parseFloat(Q.get('t')); if (isFinite(v)) frozenT = v; }
const CLEAN = Q.get('clean') === '1';
if (CLEAN) document.body.classList.add('clean');
const LOOP = 7.0, FADE_OUT = 0.3, FADE_IN = 0.3, PERIOD = LOOP + FADE_OUT + FADE_IN;
const isTouch = matchMedia('(pointer:coarse)').matches;

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const fract = (v) => v - Math.floor(v);
const D2R = Math.PI / 180;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(i, j) { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j; const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f + i * 17.3, y * f - i * 9.1); n += a; f *= 2.03; a *= 0.5; } return s / n; }

// terrain: meadow ramping up to the wall foot (x=19), green slope from the wall top up to the cliff (x~90)
function terrainH(x, z) {
  const a = clamp((x + 8) / 27, 0, 1), s = clamp(x - 20, 0, 40);
  const r = 5.0 * a * a + 1.2 * s * s / (s + 2) * smooth(-215, -110, z);
  const u = 0.5 * Math.sin(x * 0.045 + z * 0.021) + 0.35 * Math.sin(z * 0.063 - x * 0.031 + 1.3) + 0.2 * Math.sin(x * 0.13 + z * 0.11);
  return r + u * (1 - smooth(2, 17, x));
}
const GLSL_COMMON = /* glsl */`
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float terrainH(vec2 p){
  float x=p.x, z=p.y;
  float a=clamp((x+8.)/27.,0.,1.), s=clamp(x-20.,0.,40.);
  float r=5.0*a*a + 1.2*s*s/(s+2.)*smoothstep(-215.,-110.,z);
  float u=0.5*sin(x*0.045+z*0.021)+0.35*sin(z*0.063-x*0.031+1.3)+0.2*sin(x*0.13+z*0.11);
  return r + u*(1.-smoothstep(2.,17.,x));
}`;

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setClearColor(0x2a55e0, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.prepend(renderer.domElement);
let pixelRatio = Math.min(window.devicePixelRatio || 1, isTouch ? 2 : 1.5);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.25, 9000);
camera.rotation.order = 'YXZ';

// height-aware haze for every built-in material
const FOG_COL = new THREE.Color().setRGB(0.50, 0.62, 0.97, THREE.SRGBColorSpace);
scene.fog = new THREE.FogExp2(FOG_COL, 0.0011);
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
 varying vec3 vFogW;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
 vec4 fogWp = vec4(transformed,1.0);
 #ifdef USE_INSTANCING
  fogWp = instanceMatrix * fogWp;
 #endif
 vFogW = (modelMatrix * fogWp).xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
 uniform vec3 fogColor; uniform float fogDensity; varying vec3 vFogW;
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
 float fogD = length(vFogW - cameraPosition);
 float fogF = 1.0 - exp(-fogD*fogDensity*(0.3 + 0.7*exp(-max(vFogW.y,0.0)*0.004)));
 gl_FragColor.rgb = mix(gl_FragColor.rgb, fogColor, fogF);
#endif`;

// ---------------------------------------------------------------- lights
const SUN_DIR = new THREE.Vector3(0.58, 0.78, 0.12).normalize();
const sun = new THREE.DirectionalLight(new THREE.Color().setRGB(1.0, 0.93, 0.80, THREE.SRGBColorSpace), 3.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const SH = 55;
Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH, near: 1, far: 600 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 3;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(new THREE.Color().setRGB(0.46, 0.52, 1.0, THREE.SRGBColorSpace), new THREE.Color().setRGB(0.30, 0.42, 0.20, THREE.SRGBColorSpace), 1.55);
scene.add(hemi);

// ---------------------------------------------------------------- sky
const skyMat = new THREE.ShaderMaterial({
  depthWrite: false, side: THREE.BackSide, fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*p; gl_Position.z = gl_Position.w*0.99999; }`,
  fragmentShader: GLSL_COMMON + `
  varying vec3 vDir; uniform float uTime;
  vec3 s2l(vec3 c){ return pow(c, vec3(2.2)); }
  void main(){
    vec3 d = normalize(vDir);
    float h = d.y;
    float az = atan(d.x, -d.z);               // 0 = toward citadel, negative = left
    vec3 zen = s2l(vec3(0.17,0.29,0.88));
    vec3 mid = s2l(vec3(0.21,0.40,0.95));
    vec3 hor = s2l(vec3(0.52,0.66,0.98));
    vec3 c = mix(hor, mid, smoothstep(-0.02, 0.22, h));
    c = mix(c, zen, smoothstep(0.18, 0.75, h));
    // warm-lavender haze at the very horizon
    c = mix(c, s2l(vec3(0.78,0.80,0.98)), (1.-smoothstep(0.0,0.06,abs(h)))*0.55);
    // thin streaky clouds low on the left
    float band = smoothstep(0.005,0.04,h)*(1.-smoothstep(0.07,0.17,h));
    float side = smoothstep(-0.10,-0.45,az);
    float n = vnoise(vec2(az*6.0, h*60.)) * 0.6 + vnoise(vec2(az*21.0+3., h*170.))*0.4;
    float cl = smoothstep(0.45,0.78,n)*band*side;
    c = mix(c, s2l(vec3(0.95,0.93,1.0)), cl*0.85);
    if (h < 0.0) c = hor;
    gl_FragColor = vec4(c,1.);
  }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(6000, 48, 24), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);

// ---------------------------------------------------------------- terrain
function buildTerrain() {
  const N = 240;
  const g = new THREE.PlaneGeometry(2, 2, N, N); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  const cx = 15, cz = -70;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i), v = p.getZ(i);
    const x = cx + Math.sign(u) * Math.pow(Math.abs(u), 2.0) * (u < 0 ? 2600 : 700);
    const z = cz + Math.sign(v) * Math.pow(Math.abs(v), 2.0) * (v < 0 ? 2600 : 900);
    p.setXYZ(i, x, terrainH(x, z), z);
  }
  g.computeVertexNormals();
  const m = new THREE.MeshLambertMaterial({ color: 0xffffff });
  m.onBeforeCompile = (s) => {
    s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vGW;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvGW = (modelMatrix*vec4(transformed,1.)).xyz;');
    s.fragmentShader = s.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vGW;\n' + GLSL_COMMON)
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += diffuseColor.rgb*slopeGlow*0.9;')
      .replace('#include <color_fragment>', `#include <color_fragment>
      float slopeGlow = 0.;
      {
        vec2 wp = vGW.xz;
        float n1 = vnoise(wp*0.035), n2 = vnoise(wp*0.19+7.), n3 = vnoise(wp*vec2(0.6,0.18)+3.);
        vec3 g1 = vec3(0.21,0.44,0.025), g2 = vec3(0.46,0.62,0.035), g3 = vec3(0.08,0.24,0.02);
        float n4 = vnoise(wp*vec2(0.012,0.03)+11.);
        vec3 c = mix(g1, g2, smoothstep(0.25,0.85,n1));
        c = mix(c, g3, smoothstep(0.5,0.95,n2)*0.45 + smoothstep(0.6,0.85,n4)*0.3);
        c *= 0.82 + 0.36*n3;
        // slope behind the wall: bright yellow-green just above the wall, darker toward the cliff foot
        float sl = smoothstep(20.,24.,vGW.x);
        c = mix(c, mix(vec3(0.36,0.72,0.04), vec3(0.10,0.30,0.035), smoothstep(26.,36.,vGW.x)), sl*0.85);
        slopeGlow = sl*(1.-smoothstep(25.,37.,vGW.x));
        // meadow flowers
        vec2 q = wp*3.2; vec2 cell = floor(q); vec2 f = fract(q)-0.5;
        float hs = hash(cell);
        vec2 off = vec2(hash(cell+3.1), hash(cell+7.7))-0.5;
        float fw = length(fwidth(q));
        float fl = step(0.5, hs) * (1.-smoothstep(0.06, 0.06+fw, length(f-off*0.7)));
        float far = smoothstep(0.25, 0.9, fw);
        fl = mix(fl, 0.1, far) * (1.-smoothstep(16., 20., vGW.x));
        vec3 fc = mix(vec3(1.0,0.86,0.30), vec3(1.0,0.98,0.95), step(0.35, hash(cell+1.3)));
        c = c*vec3(0.62,0.66,0.9) + vec3(0.0,0.0,0.008);
        c = mix(c, fc, fl);
        diffuseColor.rgb = c;
      }`);
  };
  const mesh = new THREE.Mesh(g, m);
  mesh.receiveShadow = true;
  scene.add(mesh);
}
buildTerrain();

// ---------------------------------------------------------------- grass blades (follow the camera)
const grassUniforms = { uCam: { value: new THREE.Vector2() }, uTime: { value: 0 }, uTile: { value: 56 }, uGrassH: { value: 1 } };
function buildGrass() {
  const COUNT = isTouch ? 34000 : 52000;
  const base = new THREE.BufferGeometry();
  const pos = [], idx = [];
  const S = 4;
  for (let i = 0; i <= S; i++) { const y = i / S; const w = 1 - y * 0.85; pos.push(-0.5 * w, y, 0, 0.5 * w, y, 0); }
  for (let i = 0; i < S; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  const off = new Float32Array(COUNT * 2), rnd = new Float32Array(COUNT * 4);
  const r = rng(7);
  for (let i = 0; i < COUNT; i++) { off[i * 2] = r() * 56; off[i * 2 + 1] = r() * 56; rnd[i * 4] = r(); rnd[i * 4 + 1] = r(); rnd[i * 4 + 2] = r(); rnd[i * 4 + 3] = r(); }
  g.setAttribute('aOff', new THREE.InstancedBufferAttribute(off, 2));
  g.setAttribute('aRnd', new THREE.InstancedBufferAttribute(rnd, 4));
  g.instanceCount = COUNT;
  const m = new THREE.MeshLambertMaterial({ color: 0xffffff, side: THREE.DoubleSide });
  m.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, grassUniforms);
    s.vertexShader = s.vertexShader.replace('#include <common>', `#include <common>
      attribute vec2 aOff; attribute vec4 aRnd; uniform vec2 uCam; uniform float uTime; uniform float uTile; uniform float uGrassH; varying vec3 vGC;` + GLSL_COMMON)
      .replace('#include <beginnormal_vertex>', 'vec3 objectNormal = vec3(0.,1.,0.);')
      .replace('#include <begin_vertex>', `
      vec2 wxz = uCam + mod(aOff - uCam + uTile*0.5, uTile) - uTile*0.5;
      float dd = length(wxz - uCam);
      float fade = (1.0 - smoothstep(uTile*0.30, uTile*0.48, dd)) * smoothstep(2.5, 7.0, dd);
      bool flower = aRnd.w > 0.87;
      float hgt = (flower ? 0.13 + aRnd.y*0.10 : 0.09 + aRnd.y*0.20) * fade * uGrassH;
      if (wxz.x > 17.4 && wxz.x < 20.6) hgt = 0.0;
      float ang = aRnd.x*6.2831;
      float wid = flower ? (position.y > 0.7 ? 0.06 : 0.012) : 0.038;
      vec3 p = vec3(position.x*wid, position.y*hgt, 0.);
      vec2 dir = vec2(cos(ang), sin(ang));
      vec3 tp = vec3(dir.x*p.x, p.y, dir.y*p.x);
      float sway = sin(uTime*2.3 + wxz.x*0.35 + wxz.y*0.21)*0.5 + sin(uTime*4.1 + wxz.x*0.9)*0.25;
      vec2 lean = vec2(cos(ang*2.7), sin(ang*2.7))*(0.15+0.35*aRnd.z) + vec2(0.35,0.15)*sway;
      tp.xz += lean * position.y*position.y * hgt;
      vec3 transformed = vec3(wxz.x + tp.x, terrainH(wxz) + tp.y, wxz.y + tp.z);
      vec3 root = mix(vec3(0.15,0.34,0.02), vec3(0.24,0.44,0.025), aRnd.z);
      vec3 tip = mix(vec3(0.36,0.57,0.03), vec3(0.60,0.73,0.05), aRnd.y);
      vGC = mix(root, tip, position.y)*vec3(0.62,0.66,0.9) + vec3(0.,0.,0.008);
      if (flower && position.y > 0.7) vGC = aRnd.z > 0.4 ? vec3(1.0,0.97,0.92) : vec3(1.0,0.82,0.22);
      `);
    s.fragmentShader = s.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vGC;')
      .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = vGC;');
  };
  const mesh = new THREE.Mesh(g, m);
  mesh.frustumCulled = false; mesh.receiveShadow = true;
  scene.add(mesh);
}
buildGrass();

// ---------------------------------------------------------------- stone texture (wall)
function stoneTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#141a2a'; x.fillRect(0, 0, 512, 512);
  const r = rng(11);
  // crisp dressed stones: flat face, thin warm-lit top arris, thin dark bottom arris, a little speckle
  const stone = (bx, by, bw, bh, hue, s, l) => {
    x.fillStyle = `hsl(${hue},${s}%,${l}%)`; x.fillRect(bx, by, bw, bh);
    x.fillStyle = `hsl(${hue - 170},${s + 6}%,${Math.min(l + 18, 88)}%)`; x.fillRect(bx, by, bw, 2);
    x.fillStyle = `hsl(${hue},${s}%,${Math.min(l + 8, 85)}%)`; x.fillRect(bx, by + 2, 2, bh - 3);
    x.fillStyle = `hsl(${hue + 6},${s + 10}%,${Math.max(l - 16, 8)}%)`; x.fillRect(bx, by + bh - 2, bw, 2); x.fillRect(bx + bw - 2, by, 2, bh);
    for (let k = 0; k < bw * bh / 40; k++) { x.fillStyle = `hsla(${hue},${s}%,${l + (r() - 0.5) * 22}%,0.5)`; x.fillRect(bx + 2 + r() * (bw - 5), by + 2 + r() * (bh - 5), 2, 1); }
  };
  let y = 0;
  while (y < 512) {
    const h = 15 + Math.floor(r() * 9);
    let px = -Math.floor(r() * 40);
    while (px < 512) {
      const w = 22 + Math.floor(r() * 36);
      const dark = r() < 0.25;
      const l = dark ? 24 + r() * 8 : 40 + r() * 18, s = 5 + r() * 9, hue = 228 + r() * 16;
      const bx = px + 1.5, by = y + 1.5, bw = w - 3, bh = h - 3;
      stone(bx, by, bw, bh, hue, s, l);
      if (px + w > 512) { x.save(); x.translate(-512, 0); stone(bx, by, bw, bh, hue, s, l); x.restore(); }
      px += w;
    }
    y += h;
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function triplanarStone(scale) {
  const m = new THREE.MeshLambertMaterial({ map: stoneTexture() });
  m.onBeforeCompile = (s) => {
    s.uniforms.uScale = { value: scale };
    s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vSW; varying vec3 vSN;')
      .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
      { vec4 sw = vec4(transformed,1.);
        #ifdef USE_INSTANCING
          sw = instanceMatrix*sw;
        #endif
        vSW = (modelMatrix*sw).xyz; vSN = normalize(mat3(modelMatrix)*objectNormal); }`);
    s.fragmentShader = s.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vSW; varying vec3 vSN; uniform float uScale;')
      .replace('#include <map_fragment>', `
      { vec3 an = abs(normalize(vSN));
        vec3 tx = texture2D(map, vSW.zy*uScale).rgb, tz = texture2D(map, vSW.xy*uScale).rgb, ty = texture2D(map, vSW.xz*uScale).rgb;
        vec3 w = an/(an.x+an.y+an.z+1e-4);
        diffuseColor.rgb *= tx*w.x + tz*w.z + ty*w.y; }`)
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += diffuseColor.rgb*(vec3(0.05,0.06,0.05) + pow(max(dot(normalize(vSN), normalize(vec3(-0.45,0.35,0.82))),0.), 2.)*vec3(0.22,0.20,0.26) + smoothstep(0.6, 0.9, vSN.y)*vec3(0.9,0.75,0.5));');
  };
  return m;
}

// ---------------------------------------------------------------- wall + towers
const WALL_X = 19, WALL_Z0 = 160, WALL_Z1 = -560, WALL_Y = 5.0;
function buildWall() {
  const geos = [];
  const box = (w, h, d, x, y, z) => { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y + h / 2, z); geos.push(g.toNonIndexed()); };
  const cyl = (r, h, x, y, z, seg = 20, r2 = r) => { const g = new THREE.CylinderGeometry(r2, r, h, seg, 1); g.translate(x, y + h / 2, z); geos.push(g.toNonIndexed()); };
  const L = WALL_Z0 - WALL_Z1, TOP = 4.4;
  box(1.8, TOP + 2.5, L, WALL_X, -2.5, (WALL_Z0 + WALL_Z1) / 2);    // curtain wall
  box(0.45, 0.22, L, WALL_X - 0.95, TOP - 0.75, (WALL_Z0 + WALL_Z1) / 2);   // string course under the parapet
  const merl = [];
  for (let z = WALL_Z0; z > WALL_Z1; z -= 0.75) { merl.push([WALL_X - 0.74, TOP, z, 0.36, 0.42, 0.32]); merl.push([WALL_X + 0.74, TOP, z, 0.36, 0.4, 0.32]); }
  const rnd = rng(3);
  // towers placed from the refs: one slim drum tower at z=-29 (S1 right, S2 centre), medium towers at -46 / -60 (S3),
  // small parapet turrets between; further away an even rhythm of medium and small towers
  const towers = [[-19, 0], [-27, 2], [-35, 0], [-46, 1], [-53, 0], [-60, 1], [-68, 0], [-78, 1], [-89, 0], [-101, 1], [-114, 0]];
  for (let z = -128, i = 0; z > WALL_Z1 + 10; z -= 15, i++) towers.push([z, i % 2 ? 0 : 1]);
  for (let z = -6, i = 0; z < WALL_Z0 - 10; z += 15, i++) towers.push([z, i % 2 ? 1 : 0]);
  for (const [z, kind] of towers) {
    const R = [0.62, 1.45, 1.95][kind] + rnd() * 0.06, tx = WALL_X - [0.55, 0.8, 1.15][kind];
    const H = TOP + [0.75, 1.25, 2.3][kind] + rnd() * 0.2, seg = [12, 22, 28][kind];
    cyl(R, H + 2.5, tx, -2.5, z, seg, R * 0.97);
    const ringH = [0.32, 0.75, 1.05][kind], ringO = [0.1, 0.32, 0.5][kind];
    cyl(R + ringO, ringH, tx, H - ringH + 0.1, z, seg, R + ringO * 0.35);      // corbelled crown
    const n = [6, 12, 16][kind], top = H + 0.1;
    for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2; merl.push([tx + Math.cos(a) * (R + ringO * 0.75), top, z + Math.sin(a) * (R + ringO * 0.75), [0.3, 0.42, 0.5][kind], [0.36, 0.5, 0.6][kind], 0.2, -a]); }
    if (kind > 0) {   // corbels under the crown (machicolation)
      const nc = kind === 2 ? 24 : 16;
      for (let k = 0; k < nc; k++) { const a = (k + 0.5) / nc * Math.PI * 2; merl.push([tx + Math.cos(a) * (R + 0.06), H - ringH - 0.5, z + Math.sin(a) * (R + 0.06), 0.14, 0.55, 0.2, -a]); }
    }
    if (kind === 2) for (let k = 0; k < 3; k++) box(0.22, 0.8, 0.12, tx - R * Math.cos(0.4 * (k - 1)) - 0.02, 2.2 + k * 1.8, z + R * Math.sin(0.4 * (k - 1)));   // arrow slits
  }
  const g = mergeGeometries(geos);
  g.translate(0, WALL_Y, 0);
  const mat = triplanarStone(0.14);
  const wall = new THREE.Mesh(g, mat);
  wall.castShadow = true; wall.receiveShadow = true;
  scene.add(wall);
  const mg = new THREE.BoxGeometry(1, 1, 1); mg.translate(0, 0.5, 0);
  const im = new THREE.InstancedMesh(mg, mat, merl.length);
  const o = new THREE.Object3D();
  merl.forEach((m, i) => { o.position.set(m[0], m[1] + WALL_Y, m[2]); o.scale.set(m[5], m[4], m[3]); o.rotation.set(0, m[6] || 0, 0); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
  im.castShadow = true; im.receiveShadow = true;
  scene.add(im);
}
buildWall();

// ---------------------------------------------------------------- cliff
function buildCliff() {
  const Z0 = 320, Z1 = -150, Y0 = 6, Y1 = 1150;
  const SZ = 150, SY = 110;
  const g = new THREE.PlaneGeometry(1, 1, SZ, SY);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) + 0.5, v = p.getY(i) + 0.5;
    const z = lerp(Z0, Z1, u), y = lerp(Y0, Y1, v);
    const n1 = fbm(z * 0.010, y * 0.0030, 4);
    const n2 = fbm(z * 0.045, y * 0.006, 3);
    const w = fbm(y * 0.004, z * 0.01, 2) * 6;
    const rd = 1 - Math.abs(2 * fbm(z * 0.03 + w, y * 0.0045, 3) - 1);           // lumpy rock masses (not long ribs)
    const rd2 = 1 - Math.abs(2 * vnoise(z * 0.1 + w * 1.7, y * 0.014) - 1);
    const ledge = Math.pow(fract(y / 38 + n1 * 1.3), 6) * 3.5;              // a few stepped ledges
    const d = 16 * n1 + 7 * n2 + 6 * rd * rd + 4 * rd2 + 2.5 * vnoise(z * 0.4, y * 0.08) + ledge;
    const e = smooth(Z1 + 60, Z1, z);          // rounded buttress at the cliff's end
    const footK = lerp(0.35, 1, smooth(30, 120, y));   // keep the foot line straight so the green slope reads as a clean strip
    p.setXYZ(i, 37 - (d - 18) * footK + e * 12, y, z);
  }
  g.computeVertexNormals();
  const m = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    uniforms: { uFogCol: { value: FOG_COL }, uFogDen: { value: 0.0011 } },
    vertexShader: `varying vec3 vW; varying vec3 vN; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; vN = normalize(mat3(modelMatrix)*normal); gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: GLSL_COMMON + `uniform vec3 uFogCol; uniform float uFogDen; varying vec3 vW; varying vec3 vN;
      vec3 s2l(vec3 c){ return pow(c, vec3(2.2)); }
      void main(){
        vec3 n = normalize(vN); if (n.x > 0.) n = -n;
        float z = vW.z, y = vW.y;
        // mottled rock masses: warped noise blobs (~15 x 35 m) split into smaller blocks; each blob's slope gives lit and shadow facets
        float wq = vnoise(vec2(z*0.025, y*0.010))*3.0 + vnoise(vec2(z*0.09, y*0.04) + 6.)*0.8;
        vec2 P = vec2(z*0.10 + wq, y*0.032 + wq*0.4);
        float r1 = vnoise(P);
        vec2 g1 = vec2(vnoise(P + vec2(0.05, 0.)) - r1, vnoise(P + vec2(0., 0.05)) - r1)/0.05;
        vec2 Q = vec2(z*0.32 + wq*1.4, y*0.095 + wq*0.6);
        float r2 = vnoise(Q + 4.1);
        vec2 g2 = vec2(vnoise(Q + vec2(0.08, 0.) + 4.1) - r2, vnoise(Q + vec2(0., 0.08) + 4.1) - r2)/0.08;
        float blk = vnoise(vec2(z*0.12 + wq, y*0.045) + 9.);
        float lt = max(dot(n, normalize(vec3(-0.80, 0.30, 0.52))), 0.);
        float fine = vnoise(vec2(z*0.9 + wq, y*0.28)) + vnoise(vec2(z*2.6 + wq*2., y*0.75))*0.6;
        float facet = -g1.x*0.11 - g1.y*0.07 - g2.x*0.05 - g2.y*0.035;   // faces turned toward the sun (+z, up) catch light
        float v = 0.43 + facet + (lt - 0.72)*0.7 + (blk - 0.5)*0.18 + (fine - 0.8)*0.24 + (r1 - 0.5)*0.14;
        // painterly value steps: deep crevice, slate body, violet planes, lilac ridge highlights
        float l1 = smoothstep(0.47, 0.52, v), l2 = smoothstep(0.62, 0.67, v), l0 = smoothstep(0.32, 0.26, v);
        vec3 deep = s2l(vec3(0.04,0.06,0.06)), base = s2l(vec3(0.11,0.15,0.13)), mid = s2l(vec3(0.17,0.20,0.56)), hi = s2l(vec3(0.30,0.32,0.97));
        vec3 c = mix(base, mid, l1);
        c = mix(c, hi, l2*0.9);
        c = mix(c, s2l(vec3(0.55,0.55,1.0)), smoothstep(0.80, 0.86, v)*0.8);   // sparse lilac ridge glints
        c = mix(c, deep, l0);
        // dark outlines between the masses, large branching crevices, a few horizontal fractures
        c *= 1. - (1. - smoothstep(0.0, 0.035, abs(r1 - 0.42)))*0.65;
        c *= 1. - (1. - smoothstep(0.0, 0.03, abs(r2 - 0.5)))*0.35*step(0.45, blk);
        float cq = vnoise(vec2(z*0.045 + wq*0.9, y*0.012) + 2.);
        c *= 1. - (1. - smoothstep(0.0, 0.03 + 0.03*blk, abs(cq - 0.5)))*0.85;
        float fr = 1. - smoothstep(0.0, 0.06, abs(fract(y*0.03 + blk*1.7 + wq*0.3) - 0.5));
        c *= 1. - fr*step(0.6, vnoise(vec2(z*0.12, y*0.01) + 5.))*0.55;
        // greenish damp near the foot
        c = mix(c, s2l(vec3(0.08,0.17,0.10))*(0.7+0.8*l1), smoothstep(75., 28., y)*0.5*(1.-l2));
        float dist = length(vW - cameraPosition);
        float f = 1. - exp(-dist*uFogDen*(0.3 + 0.7*exp(-max(y,0.)*0.004)));
        gl_FragColor = vec4(mix(c, uFogCol, f*0.45), 1.);
      }`
  });
  const mesh = new THREE.Mesh(g, m);
  scene.add(mesh);
}
buildCliff();

// ---------------------------------------------------------------- distant mountains + tree line
function buildDistance() {
  // mountains
  const R = 2700, N = 260;
  const pos = [], hf = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const b = lerp(-125, -12, i / N) * D2R;
    const env = smooth(-125, -100, b / D2R) * smooth(-12, -30, b / D2R);
    const n = fbm(b * 7, 1.3, 5);
    const ridge = 1 - Math.abs(2 * fbm(b * 3.1, 7.7, 4) - 1);
    const h = env * (30 + 190 * Math.pow(n, 1.5) + 90 * ridge * ridge);
    const x = Math.sin(b) * R, z = -100 - Math.cos(b) * R;
    pos.push(x, -60, z, x, h, z);
    hf.push(0, h, h, h);
  }
  for (let i = 0; i < N; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aH', new THREE.Float32BufferAttribute(hf, 2));
  g.setIndex(idx);
  const m = new THREE.ShaderMaterial({
    side: THREE.DoubleSide, fog: false,
    vertexShader: `attribute vec2 aH; varying vec2 vH; varying vec3 vW; void main(){ vH=aH; vW=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,
    fragmentShader: GLSL_COMMON + `varying vec2 vH; varying vec3 vW;
      vec3 s2l(vec3 c){ return pow(c, vec3(2.2)); }
      void main(){
        float y = vW.y, top = vH.y;
        float rel = y/max(top,1.);
        float az = atan(vW.x, -vW.z);
        float n = vnoise(vec2(az*90., y*0.03));
        float snow = smoothstep(0.62, 0.8, rel + (n-0.5)*0.4) * smoothstep(90., 170., top);
        vec3 rock = s2l(vec3(0.30,0.40,0.84));
        vec3 c = mix(rock*(0.8+0.4*n), s2l(vec3(0.86,0.90,1.0)), snow*0.9);
        c = mix(c, s2l(vec3(0.62,0.70,0.97)), 0.25 + 0.45*(1.-smoothstep(0., 60., y)));
        gl_FragColor = vec4(c,1.);
      }`
  });
  const mt = new THREE.Mesh(g, m); mt.frustumCulled = false; scene.add(mt);
  // tree line (dark conifers)
  const tp = [], r = rng(5);
  for (let i = 0; i < 700; i++) {
    const b = lerp(-120, -20, r()) * D2R;
    const rr = 650 + r() * 380;
    const cx = Math.sin(b) * rr, cz = -100 - Math.cos(b) * rr;
    const h = (9 + r() * 14) * smooth(-20, -32, b / D2R), w = 3 + r() * 3;
    const px = Math.cos(b) * w, pz = Math.sin(b) * w;
    const gy = terrainH(cx, cz) - 1;
    tp.push(cx - px, gy, cz - pz, cx + px, gy, cz + pz, cx, gy + h, cz);
  }
  const tg = new THREE.BufferGeometry(); tg.setAttribute('position', new THREE.Float32BufferAttribute(tp, 3));
  const tm = new THREE.Mesh(tg, new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(0.10, 0.30, 0.16, THREE.SRGBColorSpace), side: THREE.DoubleSide }));
  tm.frustumCulled = false; scene.add(tm);
}
buildDistance();

// ---------------------------------------------------------------- citadel
const CIT = new THREE.Vector3(140, 0, -650);
const citUniforms = {
  uSunDir: { value: new THREE.Vector3(-0.76, 0.45, 0.47).normalize() },
  uSunCol: { value: new THREE.Color().setRGB(1.0, 0.89, 0.72, THREE.SRGBColorSpace).multiplyScalar(1.35) },
  uSkyCol: { value: new THREE.Color().setRGB(0.36, 0.42, 1.0, THREE.SRGBColorSpace).multiplyScalar(0.6) },
  uGndCol: { value: new THREE.Color().setRGB(0.36, 0.38, 1.0, THREE.SRGBColorSpace).multiplyScalar(0.42) },
  uCit: { value: CIT },
  uFogCol: { value: new THREE.Color().setRGB(0.70, 0.75, 1.0, THREE.SRGBColorSpace) },
  uFogDen: { value: 0.00034 },
  uShadowMap: { value: null },
  uShadowM: { value: new THREE.Matrix4() },
};
const makeCitMat = (defines = {}) => new THREE.ShaderMaterial({
  uniforms: citUniforms, defines,
  vertexShader: `varying vec3 vW; varying vec3 vN; varying float vTint; varying float vAO; varying vec3 vLoc; varying vec3 vScl;
    float ih(float n){ return fract(sin(n*12.9898)*43758.5453); }
    void main(){ vec4 p = vec4(position,1.); vec3 n = normal; vTint = 1.0; vAO = 1.0; vLoc = position; vScl = vec3(1.);
      #ifdef USE_INSTANCING
        p = instanceMatrix*p; n = mat3(instanceMatrix)*n; vTint = 0.86 + 0.2*ih(float(gl_InstanceID));
        vAO = clamp(position.y*1.6 + 0.12, 0., 1.);     // each house darkens toward its foot, so stacked terraces separate
        vScl = vec3(length(instanceMatrix[0].xyz), length(instanceMatrix[1].xyz), length(instanceMatrix[2].xyz));
      #endif
      vec4 w = modelMatrix*p; vW = w.xyz; vN = normalize(mat3(modelMatrix)*n);
      gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: GLSL_COMMON + `
    uniform vec3 uSunDir, uSunCol, uSkyCol, uGndCol, uFogCol, uCit; uniform float uFogDen;
    // which nested pointed-arch ring (half-width w) a facade point lies on
    float archW(vec2 p){ float ax = abs(p.x), dy = p.y - 340.;   // k = 1.12
      if (dy <= 0.) return ax;
      return (0.12*ax + sqrt(0.0144*ax*ax + 1.24*(ax*ax + dy*dy)))/1.24; }
    uniform sampler2D uShadowMap; uniform mat4 uShadowM;
    varying vec3 vW; varying vec3 vN; varying float vTint; varying float vAO; varying vec3 vLoc; varying vec3 vScl;
    float citShadow(vec3 n){
      vec4 sc = uShadowM * vec4(vW + n*1.2, 1.);
      vec3 p = sc.xyz / sc.w * 0.5 + 0.5;
      if (p.x < 0. || p.x > 1. || p.y < 0. || p.y > 1.) return 1.;
      float s = 0.; vec2 tx = vec2(1./2048.);
      for (int i=-1;i<=1;i++) for (int j=-1;j<=1;j++) s += step(p.z - 0.0008, texture2D(uShadowMap, p.xy + vec2(i,j)*tx).x);
      return s/9.;
    }
    void main(){
      vec3 n = normalize(vN);
      vec3 an = abs(n);
      float u = an.x > an.z ? vW.z : vW.x;
      float pat = 1.0, lip = 0.0;
#ifdef HOUSE
      if (an.y < 0.7) {
        // per-house facade, measured from the house's own top: lit cornice lip, its shadow, then floors of arched windows
        float uL = (an.x > an.z ? vLoc.z*vScl.z : vLoc.x*vScl.x) + vTint*7.;
        float dTop = (1.0 - vLoc.y)*vScl.y;
        float fw = max(fwidth(uL/4.6), fwidth(dTop/6.5));
        float fx = fract(uL/4.6) - 0.5, fy = fract((dTop - 3.0)/6.5);
        float ww = 0.19;
        float win = step(3.0, dTop) * step(abs(fx), ww) * step(0.18, fy) * step(fy, 0.78 - (ww - abs(fx))*0.9);
        float v = 1.0 - win*0.8;
        v = mix(v, 0.8, smoothstep(0.4, 0.9, fw));
        float under = smoothstep(1.0, 1.3, dTop) * (1. - smoothstep(2.4, 2.9, dTop));
        lip = 1. - smoothstep(0.9, 1.1, dTop);
        pat = v * (1. - under*0.42*(1. - smoothstep(0.5, 1.0, fwidth(dTop))));
      }
#else
      if (an.y < 0.7) {
        float blk = hash(floor(vec2(u/37., vW.y/53.)));
        float cw = blk > 0.5 ? 4.0 : 5.5, ch = blk > 0.75 ? 9. : 13.;
        vec2 q = vec2(u/cw, vW.y/ch);
        vec2 f = fract(q) - vec2(0.5, 0.0);
        float ww = 0.17;
        float body = step(abs(f.x), ww) * step(0.18, f.y) * step(f.y, 0.62 + (ww-abs(f.x))*0.9);
        float course = 1.0 - step(0.07, f.y);
        float rib = step(0.44, abs(f.x));
        float v = 1.0 - body*0.75 - course*0.22 - rib*0.16;
        float fw = max(fwidth(q.x), fwidth(q.y));
        pat = mix(v, 0.80, smoothstep(0.3, 0.8, fw));
      }
#endif
      // nested archivolt mouldings around the great arch: alternating lit rolls and dark grooves
      vec3 lp = vW - uCit;
      if (lp.z > -112. && lp.z < -52. && lp.y > 228. && an.y < 0.8) {
        float w = archW(lp.xy);
        if (w > 56. && w < 97.) {
          float m = fract(w/3.9);
          float roll = smoothstep(0.10, 0.30, m) * smoothstep(0.85, 0.6, m);
          float fwm = fwidth(w/3.9);
          pat = min(pat, mix(mix(0.08, 1.1, roll), 0.7, smoothstep(0.35, 0.9, fwm)));
        }
      }
      vec3 base = vec3(1.0,0.96,0.89) * vTint * (0.92 + 0.08*hash(floor(vW.xz/23.)));
      float dif = max(dot(n, uSunDir), 0.);
      dif = smoothstep(0.10, 0.66, dif)*0.8 + dif*0.2;           // painterly: warm cream lit faces, crisp turn to lavender shade
      if (dif > 0.) dif *= citShadow(n);
      vec3 hemi = mix(uGndCol, uSkyCol, n.y*0.5+0.5);
      float ao = mix(0.6, 1.0, vAO);
      vec3 col = base * (hemi*mix(0.8, 1.0, vAO) + uSunCol*dif*ao + uSunCol*lip*0.22);
      col *= mix(vec3(0.30,0.34,0.86), vec3(1.0), pat);
      col *= mix(vec3(0.80,0.82,1.0), vec3(1.0), smoothstep(0., 220., vW.y));
      float dist = length(vW - cameraPosition);
      float f = 1. - exp(-dist*uFogDen*(0.3 + 0.7*exp(-max(vW.y,0.)*0.004)));
      col = mix(col, uFogCol, f);
      gl_FragColor = vec4(col, 1.);
    }`
});
const citMat = makeCitMat(), houseMat = makeCitMat({ HOUSE: 1 });

const ARCH_K = 1.12;   // pointed-arch radius / half-width (1 = round)
function archPts(w, ys, yb, seg = 18) {
  const R = ARCH_K * w, c = R - w, a1 = Math.acos(c / R);
  const pts = [new THREE.Vector2(w, yb), new THREE.Vector2(w, ys)];
  for (let i = 1; i <= seg; i++) { const a = a1 * i / seg; pts.push(new THREE.Vector2(-c + R * Math.cos(a), ys + R * Math.sin(a))); }
  for (let i = 1; i <= seg; i++) { const a = Math.PI - a1 + a1 * i / seg; pts.push(new THREE.Vector2(c + R * Math.cos(a), ys + R * Math.sin(a))); }
  pts.push(new THREE.Vector2(-w, yb));
  return pts;
}
function archTopY(w, ys, x) { const R = ARCH_K * w, c = R - w; x = Math.abs(x); if (x > w) return -1; return ys + Math.sqrt(Math.max(0, R * R - (x + c) * (x + c))); }

function mound(lx, lz) { const dx = (lx + 10) / 330, dz = (lz + 90) / 280; const r = Math.sqrt(dx * dx + dz * dz);
  const cut = 1 - 0.8 * smooth(58, 30, Math.abs(lx + 42)) * smooth(-118, -140, lz);   // canyon behind the lower arch (hidden by the facade)
  const M = 232 * Math.pow(Math.max(0, 1 - r), 0.72) * cut;
  // lower terrace in front of the facade, so the lower arch and its block show above the city (as in the refs)
  const cap = 96 + 0.9 * Math.max(0, Math.abs(lx + 25) - 80) + 0.5 * Math.max(0, lz - 150) + 0.6 * Math.max(0, -150 - lz);
  return Math.min(M, cap); }

function buildCitadel() {
  const geos = [];
  const push = (g) => { const ng = g.index ? g.toNonIndexed() : g; for (const k of Object.keys(ng.attributes)) if (k !== 'position' && k !== 'normal') ng.deleteAttribute(k); ng.clearGroups(); geos.push(ng); };
  const box = (w, h, d, x, y, z, ry = 0) => { const g = new THREE.BoxGeometry(w, h, d); g.translate(0, h / 2, 0); if (ry) g.rotateY(ry); g.translate(x, y, z); push(g); };
  const cyl = (r, h, x, y, z, seg = 16, rTop = r) => { const g = new THREE.CylinderGeometry(rTop, r, h, seg); g.translate(x, y + h / 2, z); push(g); };
  const cone = (r, h, x, y, z, seg = 8) => { const g = new THREE.ConeGeometry(r, h, seg); g.translate(x, y + h / 2, z); push(g); };
  const dome = (r, x, y, z, seg = 20) => { const g = new THREE.SphereGeometry(r, seg, 10, 0, Math.PI * 2, 0, Math.PI / 2); g.translate(x, y, z); push(g); };
  const extr = (shape, depth, zFront) => { const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 12 }); g.translate(0, 0, zFront - depth); push(g); };
  const pinnacleRow = (x0, x1, step, y, z, h, r) => { for (let x = x0; x <= x1 + 0.01; x += step) cone(r, h, x, y, z, 4); };
  const ribs = (x0, x1, step, yFn, yTop, zFront, w = 2.0, d = 2.4) => { for (let x = x0; x <= x1 + 0.01; x += step) { const yb = yFn(x); if (yb < yTop - 2) box(w, yTop - yb, d, x, yb, zFront + d / 2 - 0.3); } };
  const groundAt = (x, z, y0) => Math.min(y0, Math.max(mound(x, z), terrainH(x + CIT.x, z + CIT.z)) - 6);
  const ribsSide = (z0, z1, step, y0, y1, xFace, w = 1.4, d = 1.6) => { for (let z = z0; z <= z1 + 0.01; z += step) box(d, y1 - y0, w, xFace - d / 2 + 0.3, y0, z); };
  const bands = (x, z, w, d, y0, y1, every) => { for (let y = y0 + every; y < y1 - 4; y += every) box(w + 3, 2.4, d + 3, x, y, z); };
  const stage = (x, z, w, y0, y1, ribStep = 4) => {
